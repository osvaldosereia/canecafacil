name: Deploy Caneca Fácil Studio\n\non:\n  push:\n    branches:\n      - main\n      - feat/admin-caneca-studio\n    paths:\n      - '.github/workflows/deploy-studio.yml'\n      - 'apps/admin/**'\n      - 'packages/core/**'\n      - 'supabase/functions/caneca-studio/**'\n      - 'package.json'\n      - 'package-lock.json'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: github-pages\n  cancel-in-progress: true\n\njobs:\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    env:\n      VITE_SUPABASE_URL: https://crkssjkmdjkohadhcsnb.supabase.co\n      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5l67oBiOlOwuqDRuVwhiFQ_gwsMg49l\n      VITE_STUDIO_ONLY: 'true'\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v5\n      - name: Set up Node.js\n        uses: actions/setup-node@v5\n        with:\n          node-version: 24\n          cache: npm\n      - name: Install dependencies\n        run: npm ci\n      - name: Configure GitHub Pages\n        uses: actions/configure-pages@v5\n      - name: Build Admin Studio\n        run: |\n          npm run build:core\n          npm run build --workspace @caneca-facil/admin -- --mode pages\n      - name: Upload Pages artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: apps/admin/dist\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n