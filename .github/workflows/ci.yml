name: Caneca Fácil CI

on:
  push:
    branches: [main, feat/caneca-facil-foundation, 'feat/caneca-facil-*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke test production API
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: sb_secret_test_placeholder
          CHAT_ORIGIN: http://localhost:5174
          NODE_ENV: test
          SESSION_COOKIE_NAME: cf_session
          SESSION_TTL_DAYS: '30'
          PORT: '3100'
        run: |
          set -euo pipefail
          npm run start --workspace @caneca-facil/api > /tmp/caneca-facil-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 0.5
          done

          cat /tmp/caneca-facil-api.log
          exit 1

  lockfile:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when needed
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock Caneca Fácil dependencies"
          git push
